# Netlify deployment for the Meridian Local site.
# The generated website lives in site/ (committed), so there is no build step:
# Netlify publishes that folder as-is. site/_redirects handles legacy URLs and the 404.
[build]
  publish = "site"

# CSS/JS are content-hashed under /assets/v/ by build/site.py, so they can be cached
# immutably; everything else (HTML, favicon, OG image) keeps Netlify's revalidating default.
[[headers]]
  for = "/assets/v/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
